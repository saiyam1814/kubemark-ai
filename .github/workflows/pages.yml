name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/benchmark-reports/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/reports
          cp -r site/* _site/
          cp docs/benchmark-reports/*.json _site/reports/ 2>/dev/null || true
          # Generate an index of published reports for the site JS
          (cd _site/reports && ls *.json 2>/dev/null | grep -v '^index.json$' | jq -R . | jq -s .) > _site/reports/index.json
          cat _site/reports/index.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
